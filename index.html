<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MouseExpert 滑鼠專家訓練營</title>
<meta name="description" content="七項滑鼠技能分級訓練：移動與停留、單擊、雙擊、拖放、右鍵選單、滾輪捲動及模擬桌面。">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-view="home">
<header class="topbar no-print">
  <button class="logo" id="logo" type="button" aria-label="返回首頁"><span aria-hidden="true">🖱️</span> MouseExpert</button>
  <div class="top-right">
    <span class="tag teacher" id="teacher-tag" hidden>老師模式</span>
    <span class="who" id="hdr-name">小玩家</span>
    <span class="stars" id="hdr-stars">★ 0 / 63</span>
    <button class="icon-btn" id="btn-settings" type="button" aria-label="設定"><span aria-hidden="true">⚙️</span></button>
  </div>
</header>
<div class="banner no-print" id="banner" role="status" hidden></div>
<main id="app"></main>

<dialog id="settings" class="no-print">
  <form method="dialog" class="dlg">
    <h2>設定</h2>
    <label class="row-field">暱稱<input id="set-name" maxlength="20" autocomplete="off"></label>
    <label class="toggle"><input type="checkbox" id="set-sound"> 音效</label>
    <label class="toggle"><input type="checkbox" id="set-big"> 大目標模式（目標放大 1.5 倍，結果標示「大目標」）</label>
    <label class="toggle"><input type="checkbox" id="set-reduced"> 減少動態效果</label>
    <label class="toggle"><input type="checkbox" id="set-teacher"> 老師模式（解鎖全部關卡，結果不記錄）</label>
    <div class="actions">
      <button type="button" class="btn danger" id="set-clear">清除所有進度</button>
      <button type="button" class="btn primary" id="set-close">完成</button>
    </div>
  </form>
</dialog>

<dialog id="confirm" class="no-print">
  <form method="dialog" class="dlg">
    <h2>確定清除所有進度？</h2>
    <p>所有星星、紀錄和證書都會刪除，不能復原。</p>
    <div class="actions">
      <button class="btn" value="no">取消</button>
      <button class="btn danger" value="yes" id="confirm-yes">確定清除</button>
    </div>
  </form>
</dialog>

<dialog id="touch-notice" class="no-print">
  <form method="dialog" class="dlg">
    <h2>你正在用手指操作</h2>
    <p>MouseExpert 是為滑鼠而設的練習，用手指只能練習部分技能（單擊、雙擊、拖放）。</p>
    <div class="actions"><button class="btn primary" value="ok">明白</button></div>
  </form>
</dialog>

<noscript><p style="padding:2rem">請開啟 JavaScript 才可以使用 MouseExpert。</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
